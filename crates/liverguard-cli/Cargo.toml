[package]
name = "liverguard-cli"
description = "LiverGuard command line: doctor, windows, capture, probe, run"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "liverguard"
path = "src/main.rs"

[dependencies]
liverguard-ir.workspace = true
liverguard-vision.workspace = true
liverguard-engine.workspace = true
liverguard-notify.workspace = true
liverguard-store.workspace = true
anyhow.workspace = true
serde_json.workspace = true
clap = { version = "4", features = ["derive"] }
ctrlc = "3"
uuid.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
liverguard-driver-mac.workspace = true

[target.'cfg(windows)'.dependencies]
liverguard-driver-win.workspace = true
