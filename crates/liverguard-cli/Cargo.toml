[package]
name = "sky-cli"
description = "Sky command line: doctor, windows, capture, probe, run"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "sky"
path = "src/main.rs"

[dependencies]
sky-ir.workspace = true
sky-vision.workspace = true
sky-engine.workspace = true
sky-store.workspace = true
anyhow.workspace = true
serde_json.workspace = true
clap = { version = "4", features = ["derive"] }
ctrlc = "3"
uuid.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
sky-driver-mac.workspace = true

[target.'cfg(windows)'.dependencies]
sky-driver-win.workspace = true
