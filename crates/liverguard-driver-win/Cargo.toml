[package]
name = "sky-driver-win"
description = "Sky Windows platform layer: Windows.Graphics.Capture, SendInput, UI Automation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = ["driver"]
# The `Driver` impl for the engine. Off, the crate is pure platform code with no OpenCV,
# which is what `cargo check --target x86_64-pc-windows-msvc` uses from a Mac.
driver = ["dep:sky-engine", "dep:sky-vision", "dep:opencv"]

[target.'cfg(windows)'.dependencies]
sky-ir.workspace = true
sky-engine = { workspace = true, optional = true }
sky-vision = { workspace = true, optional = true }
opencv = { workspace = true, optional = true }
thiserror.workspace = true

[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
  "Foundation",
  "Graphics",
  "Graphics_Capture",
  "Graphics_DirectX",
  "Graphics_DirectX_Direct3D11",
  "Win32_Foundation",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Gdi",
  "Win32_System_Com",
  "Win32_System_Threading",
  "Win32_System_WinRT",
  "Win32_System_WinRT_Direct3D11",
  "Win32_System_WinRT_Graphics_Capture",
  "Win32_UI_Accessibility",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
]
