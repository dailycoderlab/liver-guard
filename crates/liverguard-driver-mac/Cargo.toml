[package]
name = "liverguard-driver-mac"
description = "LiverGuard macOS platform layer: ScreenCaptureKit capture, CGEvent input, Accessibility lookup"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = ["driver"]
# The `Driver` impl for the engine. Off, the crate is pure platform code with no OpenCV.
driver = ["dep:liverguard-engine", "dep:liverguard-vision", "dep:opencv"]

[target.'cfg(target_os = "macos")'.dependencies]
liverguard-ir.workspace = true
liverguard-engine = { workspace = true, optional = true }
liverguard-vision = { workspace = true, optional = true }
opencv = { workspace = true, optional = true }
thiserror.workspace = true
screencapturekit = { version = "11", features = ["macos_14_0"] }
core-graphics = "0.25"
core-foundation = "0.10"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "libc", "NSRunningApplication"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSURL", "NSString"] }
