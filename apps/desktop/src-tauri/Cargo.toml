[package]
name = "liverguard-desktop"
description = "LiverGuard desktop app: node canvas editor and local runner"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
default-run = "liverguard-desktop"

[lib]
name = "liverguard_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
liverguard-ir.workspace = true
liverguard-vision.workspace = true
liverguard-engine.workspace = true
liverguard-store.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
opencv.workspace = true
tauri = { version = "2", features = [] }

[target.'cfg(target_os = "macos")'.dependencies]
liverguard-driver-mac.workspace = true

[target.'cfg(windows)'.dependencies]
liverguard-driver-win.workspace = true
