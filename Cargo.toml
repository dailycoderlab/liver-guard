[workspace]
resolver = "2"
members = [
  "crates/liverguard-ir",
  "crates/liverguard-vision",
  "crates/liverguard-engine",
  "crates/liverguard-store",
  "crates/liverguard-notify",
  "crates/liverguard-driver-mac",
  "crates/liverguard-driver-win",
  "crates/liverguard-cli",
  "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.2.1"
edition = "2021"
rust-version = "1.88"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
rand = "0.9"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
opencv = { version = "0.101", default-features = false, features = ["imgproc", "imgcodecs", "features2d", "calib3d", "flann"] }

liverguard-ir = { path = "crates/liverguard-ir" }
liverguard-vision = { path = "crates/liverguard-vision" }
liverguard-engine = { path = "crates/liverguard-engine" }
liverguard-store = { path = "crates/liverguard-store" }
liverguard-notify = { path = "crates/liverguard-notify" }
liverguard-driver-mac = { path = "crates/liverguard-driver-mac", default-features = true }
liverguard-driver-win = { path = "crates/liverguard-driver-win", default-features = true }

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
