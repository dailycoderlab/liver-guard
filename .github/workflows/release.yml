# Build the desktop installers for macOS (Apple Silicon) and Windows (x64) and, for a
# version tag, publish them as a draft GitHub Release.
#
#   git tag v0.2.0 && git push origin v0.2.0   build + draft release
#   Actions -> Release -> Run workflow         build only; installers are kept as run artifacts
#
# Run it once by hand on main first: caches written by a tag run can only be read by that
# tag, while tag runs can read caches written on main.
#
# Not code-signed: there is no Apple Developer ID or Windows certificate behind this. See
# README "持续集成与发布" for what to add when there is.
#
# The installers also produce the updater packages and `latest.json` that the in-app update
# reads. Those are signed with the Actions secret TAURI_SIGNING_PRIVATE_KEY (README "应用内更新");
# a run without that secret fails in the first job.

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # Cheap and runs first: wrong version numbers or a broken web app should not cost
  # twenty minutes of macOS runner time.
  web:
    name: Web checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/web/pnpm-lock.yaml

      # The updater packages cannot be built without the signing key; fail now, not after the
      # twenty minutes of macOS and Windows builds.
      - name: Updater signing key is configured
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "The Actions secret TAURI_SIGNING_PRIVATE_KEY is not set (README \"应用内更新\")." >&2
            exit 1
          fi

      - name: Tag matches the version in the project
        if: startsWith(github.ref, 'refs/tags/v')
        run: node scripts/ci/check-version.mjs "$GITHUB_REF_NAME"

      - name: Install, typecheck, test
        working-directory: apps/desktop/web
        run: |
          pnpm install --frozen-lockfile
          pnpm typecheck
          pnpm test

  build:
    name: Build ${{ matrix.name }}
    needs: web
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            # Needs the macOS 26 SDK (Xcode 26): screencapturekit's apple-metal dependency
            # compiles Swift that names macOS 26 Metal types even though it only uses them behind
            # `#available`, so macos-15 (SDK 15) fails. macos-14 images are retired (2026-11-02).
            # Pinned rather than macos-latest so the toolchain does not change under a release;
            # the deployment target stays macOS 14.
            os: macos-26
            bundles: app,dmg
            # The installer, then the updater package (.app.tar.gz) with its signature.
            installers: |
              target/release/bundle/dmg/*.dmg
              target/release/bundle/macos/*.app.tar.gz
              target/release/bundle/macos/*.app.tar.gz.sig
          - name: windows-x64
            os: windows-2022
            bundles: nsis
            # The NSIS installer is also the updater package; its signature sits next to it.
            installers: |
              target/release/bundle/nsis/*-setup.exe
              target/release/bundle/nsis/*-setup.exe.sig
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/web/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.name }}
          cache-on-failure: true

      # The opencv crate generates its bindings with libclang.
      - name: Locate libclang (macOS)
        if: runner.os == 'macOS'
        run: |
          dir="$(xcode-select -p)/Toolchains/XcodeDefault.xctoolchain/usr/lib"
          [ -f "$dir/libclang.dylib" ] || dir=/Library/Developer/CommandLineTools/usr/lib
          echo "LIBCLANG_PATH=$dir" >> "$GITHUB_ENV"
      - name: Locate libclang (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: echo 'LIBCLANG_PATH=C:\Program Files\LLVM\bin' >> "$GITHUB_ENV"

      # Puts cl.exe, link.exe and the Windows SDK on PATH for OpenCV, cargo and NSIS.
      # Not ilammy/msvc-dev-cmd: its latest release (v1.13.0) still runs on Node 20, which
      # GitHub is retiring. This one runs on Node 24 and takes the same `arch` input.
      - uses: TheMrMilchmann/setup-msvc-dev@v4.1.0
        if: runner.os == 'Windows'
        with:
          arch: x64

      # Git Bash's /usr/bin/link (a coreutils tool) shadows MSVC's link.exe inside bash steps,
      # so rustc fails with "/usr/bin/link: extra operand". build-opencv.sh removes it too, but
      # only when it actually builds OpenCV; on an OpenCV cache hit it exits before that.
      - name: Remove Git's link.exe (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: rm -f /usr/bin/link.exe

      - name: Cache OpenCV
        uses: actions/cache@v6
        with:
          path: .opencv-prefix
          key: opencv-${{ matrix.name }}-${{ hashFiles('scripts/ci/build-opencv.sh') }}

      # A cache hit only prints and exports the OpenCV_DIR / CMAKE_PREFIX_PATH variables.
      - name: Build OpenCV (minimal, static)
        shell: bash
        run: scripts/ci/build-opencv.sh "$PWD/.opencv-prefix"

      - name: Install web dependencies
        working-directory: apps/desktop/web
        run: pnpm install --frozen-lockfile

      - name: Build installer
        working-directory: apps/desktop
        shell: bash
        env:
          # No Developer ID: seal the .app with an ad-hoc signature (macOS only; ignored elsewhere).
          APPLE_SIGNING_IDENTITY: '-'
          # Signs the updater packages (not the installers). The key has no password.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        run: |
          cargo_args=()
          if [ "$RUNNER_OS" = Windows ]; then
            # The static OpenCV lists system import libraries (kernel32, gdi32, ...) as
            # `static=` native libraries, and rustc then looks for them itself, only in -L
            # paths; it does not consult the LIB variable that link.exe uses. Point it at
            # the Windows SDK directory that setup-msvc-dev put in LIB. rustflags goes through
            # cargo --config as an array because the path contains spaces.
            um=""
            IFS=';' read -ra lib_dirs <<<"$LIB"
            for d in "${lib_dirs[@]}"; do
              if [ -f "$d/kernel32.lib" ]; then um="$(cygpath -m "$d")"; break; fi
            done
            [ -n "$um" ] || { echo "kernel32.lib not found in LIB=$LIB" >&2; exit 1; }
            echo "Windows SDK libraries: $um"
            cargo_args=(-- --config "build.rustflags=['-L','native=$um']")
          fi
          # Tauri downloads NSIS from github.com at bundle time; if that returns a 504, use
          # "Re-run failed jobs" (the Rust and OpenCV caches make the retry quick).
          # createUpdaterArtifacts is switched on here, not in tauri.conf.json: a local
          # `tauri build` (scripts/mac-dev-build.sh) has no signing key and would fail with it.
          ./web/node_modules/.bin/tauri build --bundles ${{ matrix.bundles }} \
            --config '{"bundle":{"createUpdaterArtifacts":true}}' "${cargo_args[@]}"

      # One flat folder, so the release job gets plain file names whatever directories
      # the bundles were written to. A pattern that matches nothing fails the build.
      - name: Collect release files
        shell: bash
        env:
          PATTERNS: ${{ matrix.installers }}
        run: |
          mkdir staging
          while IFS= read -r pattern; do
            [ -n "$pattern" ] || continue
            files=($pattern)
            [ -e "${files[0]}" ] || { echo "No file matches $pattern" >&2; exit 1; }
            cp "${files[@]}" staging/
          done <<< "$PATTERNS"
          ls -l staging

      - uses: actions/upload-artifact@v7
        with:
          name: liverguard-${{ matrix.name }}
          path: staging/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Draft GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: liverguard-*
          path: dist
          merge-multiple: true

      # What the in-app update fetches from /releases/latest/download/latest.json once the
      # draft is published. Fails if either platform lacks a signed package.
      - name: Update manifest
        env:
          TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          node scripts/ci/generate-update-manifest.mjs \
            --version "${TAG#v}" --tag "$TAG" --repository "$REPOSITORY" \
            --assets-dir dist --output dist/latest.json
          cat dist/latest.json

      - name: Checksums
        working-directory: dist
        run: sha256sum * | tee SHA256SUMS.txt

      # A draft: the installers are unsigned and Windows has never run on real hardware,
      # so someone reads the notes and presses Publish. A re-run replaces the files.
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* \
              --draft \
              --title "LiverGuard $TAG" \
              --notes-file .github/release-notes.md \
              --generate-notes
          fi
